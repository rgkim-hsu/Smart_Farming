# SonarCloud 프로젝트 정보
sonar.projectKey=rgkim-hsu_Smart_Farming
sonar.organization=rgkim-hsu

# 프로젝트 메타데이터
sonar.projectName=Smart Farming IoT System
sonar.projectVersion=1.0

# 백엔드 소스 (Node.js/TypeScript)
sonar.sources=iot-backend/src,iot-dashboard/src

# 테스트
sonar.tests=iot-backend/src/**/*.test.ts,iot-backend/src/**/*.spec.ts

# TypeScript 설정
sonar.typescript.lcov.reportPaths=iot-backend/coverage/lcov.info,iot-dashboard/coverage/lcov.info

# 제외
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/prisma/**,**/.next/**

# 중복 검사 제외
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts